<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weather Alert | Vaayu</title>

<link rel="stylesheet" href="../css/alert.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<!-- Sidebar -->

<aside class="sidebar">

<div class="logo">
<img src="../assets/mylogo.jpeg" alt="myLogo">
<h2>Vaayu</h2>
</div>

<nav>

<a href="index.html">
<i class="fa-solid fa-house"></i>
Home
</a>

<a href="liveweather.html">
<i class="fa-solid fa-cloud"></i>
Live Weather
</a>

<a href="forecast.html">
<i class="fa-solid fa-calendar-days"></i>
Forecast
</a>

<a href="rainprediction.html">
<i class="fa-solid fa-droplet"></i>
Rain Prediction
</a>

<a href="weatheralert.html" class="active">
<i class="fa-solid fa-triangle-exclamation"></i>
Weather Alert
</a>

</nav>

</aside>

<!-- Main -->

<main class="main">

<header class="topbar">

<h2>Weather Alerts</h2>

<div class="live-status" id="alertStatus">
<i class="fa-solid fa-circle"></i>
Live Monitoring
</div>

</header>


<!-- Hero Alert -->

<section class="hero-alert" id="heroAlert">

<div>

<h1 id="heroAlertTitle">
Checking Alerts...
</h1>

<p id="heroAlertLocation">
Patna, Bihar
</p>

<span id="heroAlertTime">
Checking latest alert status...
</span>

</div>

<div class="alert-icon">

<i
id="heroAlertIcon"
class="fa-solid fa-triangle-exclamation">
</i>

</div>

</section>


<!-- Alert Cards -->

<section
class="alert-grid"
id="alertGrid">

<!-- Alert cards generated by JavaScript -->

</section>


<!-- Timeline -->

<section class="timeline-card">

<h3>Alert Timeline</h3>

<div
class="timeline"
id="alertTimeline">

<div class="event">

<div class="dot yellow-dot"></div>

<div>

<h4 id="timelineTitle">
Monitoring
</h4>

<p id="timelineMessage">
Checking active weather alerts for your location.
</p>

</div>

</div>

</div>

</section>


<!-- Emergency -->

<section class="emergency-card">

<h3>Emergency Quick Actions</h3>

<div class="buttons">

<button id="emergencyButton">
<i class="fa-solid fa-phone"></i>
Emergency Call
</button>

<button id="shelterButton">
<i class="fa-solid fa-location-dot"></i>
Nearest Shelter
</button>

<button id="enableAlertButton">
<i class="fa-solid fa-bell"></i>
Enable Alerts
</button>

</div>

</section>

</main>

</div>

<script src="../js/alert.js"></script>

</body>

</html>
