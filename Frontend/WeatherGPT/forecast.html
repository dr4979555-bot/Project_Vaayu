<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forecast | Vaayu</title>

<link rel="stylesheet" href="../css/forecast.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<!-- Sidebar -->

<aside class="sidebar">

<div class="logo">
<img src="../assets/mylogo.jpeg" alt="myLogo">
<h2>Vaayu</h2>
</div>

<nav>

<a href="index.html">
<i class="fa-solid fa-house"></i>
Home
</a>

<a href="liveweather.html">
<i class="fa-solid fa-cloud"></i>
Live Weather
</a>

<a href="forecast.html" class="active">
<i class="fa-solid fa-calendar-days"></i>
Forecast
</a>

</nav>

</aside>

<!-- Main -->

<main class="main">

<header class="topbar">

<h2>7-Day Weather Forecast</h2>

<div class="city" id="forecastLocation">
<i class="fa-solid fa-location-dot"></i>
Patna, Bihar
</div>

</header>

<!-- Forecast Cards -->

<section class="forecast-grid" id="forecastGrid">

<!-- JavaScript will generate the 7 forecast cards here -->

</section>

<!-- Temperature Trend -->

<section class="chart-card">

<div class="section-header">

<h3>Temperature Trend</h3>

</div>

<svg
id="temperatureChart"
viewBox="0 0 600 220"
width="100%"
height="220">

</svg>

</section>

<!-- Rain + Sun -->

<section class="bottom-grid">

<div class="info-card">

<h3>Rain Probability</h3>

<div class="progress">

<div
class="fill"
id="rainProbabilityFill"
style="width:0%;">
</div>

</div>

<p id="rainProbabilityText">
Loading forecast...
</p>

</div>

<div class="info-card">

<h3>Sunrise & Sunset</h3>

<div class="sun-time">

<div>

<i class="fa-solid fa-sun"></i>

<p id="sunriseTime">
--:--
</p>

</div>

<div>

<i class="fa-solid fa-moon"></i>

<p id="sunsetTime">
--:--
</p>

</div>

</div>

</div>

</section>

</main>

</div>

<script src="../js/forecast.js"></script>

</body>
</html>
